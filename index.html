function connectHtml(){const mt=myTags(me.u),mg=new Set(ent('j_').filter(([k,o])=>o.u===me.u).map(([k,o])=>o.g)),md=C['d_'+me.u+'_'+day(new Date())],fol=new Set(ent('f_').filter(([k,o])=>o.a===me.u).map(([k,o])=>o.b));
 const L=ent('u_').map(([k,o])=>o).filter(o=>o.u!==me.u&&!blocked(o.u)&&!fol.has(o.u)).map(o=>{let sc=0,why=[];const t=[...myTags(o.u)].filter(x=>mt.has(x));if(t.length){sc+=2*t.length;why.push(t.slice(0,2).join(' '))}
  const g=ent('j_').filter(([k,j])=>j.u===o.u&&mg.has(j.g)).length;if(g){sc+=3*g;why.push('same group')}const d=C['d_'+o.u+'_'+day(new Date())];if(md&&d&&d.m===md.m){sc+=2;why.push('same mood today '+d.m)}return {o,sc,why}}).sort((a,b)=>b.sc-a.sc).slice(0,12);
 return '<h3>Connection Hub 🤝</h3><p class="small">People who share your hashtags, groups or mood.</p>'+(L.map(x=>`<div class="card"><div class="top">${av(x.o.u)}<div>${nm(x.o.u)}<div class="small">${x.why.length?E(x.why.join(' · ')):'New to UPLINQ'}</div></div></div><div class="row" style="margin-top:8px">${ubtn(x.o.u)}</div></div>`).join('')||'<div class="card muted">No suggestions yet.</div>')}
const enrolled=id=>!!C['en_'+id+'_'+me.u];
function academyHtml(){let h='<h3>Academy 🎓</h3>';
 if(cs&&C[cs]){const c=C[cs],ok=c.price<=0||enrolled(cs)||ADMIN;h+=`<button class="ghost btn-s" onclick="cs='';draw()">← Courses</button><div class="card"><b>${E(c.title)}</b><p class="muted">${E(c.desc)}</p>${ok?`<div class="post">${E(c.body)}</div>`:`<p>${c.price} coins</p><button onclick="enroll('${cs}')">Unlock for ${c.price} coins</button>`}</div>`}
 else h+=(ent('cs_').sort((a,b)=>b[1].ts-a[1].ts).map(([k,c])=>`<div class="card" onclick="cs='${k}';draw()"><b>${E(c.title)}</b> <span class="pill">${c.price>0?c.price+' coins':'Free'}</span>${enrolled(k)?' <span class="pill">Unlocked</span>':''}<div class="small">${E(c.desc.slice(0,80))}</div></div>`).join('')||'<div class="card muted">No courses yet.</div>')+(ADMIN?'<div class="card"><h3>Admin: add course</h3><input id="csT" placeholder="Title" maxlength="80"><input id="csD" placeholder="Short description" maxlength="160"><input id="csP" placeholder="Price in coins (0 = free)" inputmode="numeric"><textarea id="csB" placeholder="Lessons / content" maxlength="3000"></textarea><button onclick="addCourse()">Publish course</button></div>':'');
 return h}
function enroll(id){const c=C[id];if(!c)return;if(spend(me.u)<c.price)return toast('Not enough coins. Buy coins in Earn.');put('en_'+id+'_'+me.u,{c:id,u:me.u,n:c.price,ts:Date.now()});toast('Course unlocked!')}
function addCourse(){const t=$('csT').value.trim();if(!t)return toast('Add a title');put('cs_'+rid(),{title:t,desc:$('csD').value.trim(),price:Math.max(0,parseInt($('csP').value)||0),body:$('csB').value.trim(),by:me.u,ts:Date.now()});['csT','csD','csP','csB'].forEach(i=>$(i).value='');toast('Course published')}
function shopHtml(){return `<h3>Shop 🛍️</h3><p class="small">Your coins: <b>${spend(me.u)}</b>. Get coins in the Earn tab.</p>`+SHOP.map(it=>{const o=owns(it[0]),on=me.theme===it[0]||me.frame===it[0],ic=it[1]==='stickers'?it[4].slice(0,2):`<span style="display:inline-block;width:28px;height:28px;border-radius:50%;background:${it[4]}"></span>`;
 return `<div class="card top"><div style="font-size:24px;flex:none">${ic}</div><div><b>${E(it[2])}</b><div class="small">${it[3]} coins</div></div>${o?(it[1]==='stickers'?'<span class="pill" style="flex:none">Owned</span>':`<button class="btn-s" style="flex:none" onclick="equip('${it[1]}','${on?'':it[0]}')">${on?'Remove':'Use'}</button>`):`<button class="btn-s" style="flex:none" onclick="buy('${it[0]}')">Buy</button>`}</div>`}).join('')}
function eventsHtml(){return '<h3>Events 🎉</h3>'+(ent('ev_').sort((a,b)=>b[1].ts-a[1].ts).map(([k,e])=>{const R=ent('rs_').filter(([x,o])=>o.e===k),go=R.some(([x,o])=>o.u===me.u),own=e.by===me.u||ADMIN;
 return `<div class="card"><b>${E(e.title)}</b>${e.give?' <span class="pill">Giveaway</span>':''}<div class="small">${E(e.when)} · ${E(e.place)}</div><p>${E(e.desc)}</p><div class="small">by ${nm(e.by)} · ${R.length} going</div>${e.winner?`<div class="notice">🏆 Winner: ${nm(e.winner)}</div>`:''}<div class="actions" style="margin-top:8px"><button class="btn-s${go?' ghost':''}" onclick="rsvp('${k}')">${go?'Going ✓':"I'm going"}</button>${own?`<button class="ghost btn-s" onclick="del('${k}')">Delete</button>`:''}${e.give&&!e.winner&&own&&R.length?`<button class="btn-s" onclick="pickWinner('${k}')">Pick winner</button>`:''}</div></div>`}).join('')||'<div class="card muted">No events yet.</div>')+'<div class="card"><h3>Create an event</h3><input id="evT" placeholder="Event name" maxlength="60"><input id="evW" placeholder="When (e.g. Sat 15 Nov, 4pm)" maxlength="40"><input id="evP" placeholder="Where (or Online)" maxlength="60"><textarea id="evD" placeholder="Details" maxlength="300"></textarea><label><input type="checkbox" id="evG" style="width:auto"> This is a giveaway</label><button onclick="addEvent()">Create</button></div>'}
function addEvent(){const t=$('evT').value.trim();if(!t)return toast('Add an event name');put('ev_'+rid(),{by:me.u,title:t,when:$('evW').value.trim(),place:$('evP').value.trim(),desc:$('evD').value.trim(),give:!!$('evG').checked,ts:Date.now()});['evT','evW','evP','evD'].forEach(i=>$(i).value='');toast('Event created')}
function rsvp(k){const t='rs_'+k+'_'+me.u;C[t]?del(t):put(t,{e:k,u:me.u})}
function pickWinner(k){const R=ent('rs_').filter(([x,o])=>o.e===k);if(R.length)put(k,{...C[k],winner:R[Math.random()*R.length|0][1].u})}
function listsHtml(){if(pls&&C[pls]){const p=C[pls],S=ent('ps_').filter(([k,o])=>o.pl===pls).sort((a,b)=>a[1].ts-b[1].ts);
  return `<button class="ghost btn-s" onclick="pls='';draw()">← Playlists</button><div class="card"><b>${E(p.mood||'🎵')} ${E(p.title)}</b><div class="small">by ${nm(p.by)} · anyone can add songs</div>${S.map(([k,s])=>`<div class="listitem row"><span onclick="openUrl('${E(s.url)}')">▶ ${E(s.title)}</span><span class="small" style="flex:none">@${E(s.by)}</span></div>`).join('')||'<p class="small">No songs yet.</p>'}<input id="psT" placeholder="Song name" maxlength="60"><input id="psU" placeholder="Link (https://...)" autocapitalize="none"><button onclick="addSong()">Add song</button></div>`}
 return '<h3>Symphony of Us 🎵</h3>'+ent('pl_').sort((a,b)=>b[1].ts-a[1].ts).map(([k,p])=>`<div class="card" onclick="pls='${k}';draw()"><b>${E(p.mood||'🎵')} ${E(p.title)}</b><div class="small">${ent('ps_').filter(([x,o])=>o.pl===k).length} songs · by @${E(p.by)}</div></div>`).join('')+'<div class="card"><h3>New playlist</h3><input id="plT" placeholder="Playlist name" maxlength="50"><input id="plM" placeholder="Mood emoji (e.g. 😄)" maxlength="4"><button onclick="addPl()">Create</button></div>'}
function addPl(){const t=$('plT').value.trim();if(!t)return toast('Add a name');put('pl_'+rid(),{by:me.u,title:t,mood:$('plM').value.trim(),ts:Date.now()});$('plT').value='';$('plM').value=''}
function addSong(){const t=$('psT').value.trim(),u=$('psU').value.trim();if(!t||!/^https:\/\/[^\s'"<>]{4,250}$/.test(u))return toast('Add a song name and an https:// link');put('ps_'+rid(),{pl:pls,by:me.u,title:t,url:u,ts:Date.now()});$('psT').value='';$('psU').value=''}
function coHtml(){return '<h3>Co-create ✍️</h3><p class="small">Start a shared story with a friend. Take turns adding lines.</p>'+ent('jp_').filter(([k,o])=>o.a===me.u||o.b===me.u).sort((a,b)=>b[1].ts-a[1].ts).map(([k,j])=>{const S=ent('jl_').filter(([x,o])=>o.jp===k).sort((a,b)=>a[1].ts-b[1].ts);
  return `<div class="card"><b>${E(j.title)}</b><div class="small">${nm(j.a)} + ${nm(j.b)}</div>${S.map(([x,o])=>`<p><b>${E(o.by)}:</b> ${E(o.text)}</p>`).join('')}<div class="row"><input id="jl_${k}" placeholder="Add your line" maxlength="200"><button style="flex:none" onclick="addLine('${k}')">Add</button></div></div>`}).join('')+'<div class="card"><h3>New co-story</h3><input id="jpT" placeholder="Title" maxlength="60"><input id="jpB" placeholder="Friend\'s username" autocapitalize="none"><button onclick="addJp()">Start</button></div>'}
function addLine(k){const x=$('jl_'+k).value.trim();if(x)put('jl_'+rid(),{jp:k,by:me.u,text:x,ts:Date.now()})}
function addJp(){const t=$('jpT').value.trim(),b=$('jpB').value.trim().toLowerCase();if(!t||!C['u_'+b]||b===me.u)return toast('Add a title and a valid friend username');put('jp_'+rid(),{a:me.u,b,title:t,ts:Date.now()});$('jpT').value='';$('jpB').value=''}

/* ===== v22: MissionLoop ===== */
const MCAT=['Business & earning','Education & skills','Fitness & personal goals','Community projects','Entertainment & challenges','Helping other people'];
let mcat='',msel='';
const mMembers=id=>ent('mm_').filter(([k,o])=>o.m===id).map(x=>x[1].u);
const mDone=(id,u)=>ent('mp_').filter(([k,o])=>o.m===id&&o.u===u).length;
function mPct(id){const m=C[id];if(!m||!m.steps)return 0;const n=m.steps.length,mem=mMembers(id);if(!n||!mem.length)return 0;return Math.round(mem.reduce((a,u)=>a+Math.min(n,mDone(id,u)),0)/(n*mem.length)*100)}
function joinM(id){put('mm_'+id+'_'+me.u,{m:id,u:me.u,ts:Date.now()})}
function leaveM(id){del('mm_'+id+'_'+me.u)}
function stepM(id,i){if(!mMembers(id).includes(me.u))return toast('Join the mission first');const t='mp_'+id+'_'+me.u+'_'+i;C[t]?del(t):put(t,{m:id,u:me.u,i,ts:Date.now()})}
function addMission(){const t=$('mT').value.trim(),st=$('mS').value.split('\n').map(x=>x.trim().slice(0,80)).filter(Boolean).slice(0,8);if(!t||!st.length)return toast('Add a title and at least one step');
 const id='ms_'+rid();put(id,{by:me.u,title:t.slice(0,80),desc:$('mD').value.trim().slice(0,300),cat:parseInt($('mC').value)||0,steps:st,ts:Date.now()});joinM(id);['mT','mD','mS'].forEach(i=>$(i).value='');msel=id;toast('Mission created! Invite friends to join.');draw()}
function addResult(id){const t=$('mrT').value.trim();if(!t)return toast('Tell us how it went');const a=$('mrA')?String(parseInt($('mrA').value)||''):'';put('mr_'+rid(),{m:id,u:me.u,text:t.slice(0,200),amt:a,ts:Date.now()});$('mrT').value='';if($('mrA'))$('mrA').value='';toast('Result saved')}
function celebrate(id){const m=C[id];if(!m||!mMembers(id).includes(me.u)||mDone(id,me.u)<m.steps.length)return;put('mc_'+id+'_'+me.u,{m:id,u:me.u,ts:Date.now()});
 const r=ent('mr_').filter(([k,o])=>o.m===id&&o.u===me.u).sort((a,b)=>b[1].ts-a[1].ts)[0];
 put('p_'+rid(),{by:me.u,text:'🏁 I completed the mission "'+m.title+'"! 🎉'+(r?' '+r[1].text:'')+' #missionloop',img:'',vid:'',ts:Date.now(),g:''});toast('🎉 Mission complete! Shared to your feed')}
function missionsHtml(){
 if(msel&&C[msel]){const m=C[msel],mem=mMembers(msel),joined=mem.includes(me.u),n=m.steps.length,my=mDone(msel,me.u),pct=mPct(msel),R=ent('mr_').filter(([k,o])=>o.m===msel).sort((a,b)=>b[1].ts-a[1].ts),tot=R.reduce((a,[k,o])=>a+(+o.amt||0),0),celeb=!!C['mc_'+msel+'_'+me.u];
  return `<button class="ghost btn-s" onclick="msel='';draw()">← Missions</button><div class="card"><span class="pill">${E(MCAT[m.cat]||'Mission')}</span><h3>${E(m.title)}</h3><p class="muted">${E(m.desc)}</p><div class="small">by ${nm(m.by)} · ${mem.length} member${mem.length==1?'':'s'}</div><div style="background:#281b40;border-radius:8px;height:12px;margin:10px 0"><div style="width:${pct}%;height:12px;border-radius:8px;background:linear-gradient(90deg,#8b5cf6,#e879f9)"></div></div><div class="small">Team progress ${pct}%${tot?' · KSh '+tot+' earned together':''}</div>${joined?`<button class="ghost btn-s" style="margin-top:8px" onclick="leaveM('${msel}')">Leave</button>`:`<button style="margin-top:8px" onclick="joinM('${msel}')">Join this mission</button>`}</div>`
  +(joined?`<div class="card"><h3>Your steps (${my}/${n})</h3>${m.steps.map((s,i)=>`<div class="listitem row" onclick="stepM('${msel}',${i})"><span>${C['mp_'+msel+'_'+me.u+'_'+i]?'✅':'⬜'} ${E(s)}</span></div>`).join('')}${my>=n?(celeb?'<p class="notice">🏁 You finished this mission!</p>':`<button onclick="celebrate('${msel}')">🎉 Celebrate &amp; share</button>`):''}</div>`:'')
  +(joined&&my>=n?`<div class="card"><h3>Record your result</h3><textarea id="mrT" placeholder="What happened? What did you achieve or learn?" maxlength="200"></textarea>${m.cat===0?'<input id="mrA" placeholder="Amount earned or sold (KSh, optional)" inputmode="numeric">':''}<button onclick="addResult('${msel}')">Save result</button></div>`:'')
  +'<h3>Results</h3>'+(R.map(([k,o])=>`<div class="card"><div class="top">${av(o.u)}<div>${nm(o.u)}<div class="small">${ago(o.ts)}</div></div>${o.amt?`<span class="pill" style="flex:none">KSh ${E(o.amt)}</span>`:''}</div><div class="post">${E(o.text)}</div></div>`).join('')||'<p class="small">No results yet.</p>')
  +'<h3>Members</h3>'+mem.map(u=>`<div class="listitem top">${av(u)}<div>${nm(u)}<div class="small">${mDone(msel,u)}/${n} steps</div></div></div>`).join('')}
 const L=ent('ms_').filter(([k,m])=>m&&m.steps&&(mcat===''||String(m.cat)===mcat)).sort((a,b)=>b[1].ts-a[1].ts);
 return '<h3>MissionLoop 🚀</h3><p class="small">Team up on a goal, track progress, share results and celebrate.</p><div style="display:flex;overflow-x:auto;gap:6px;padding-bottom:6px"><button class="btn-s'+(mcat===''?'':' ghost')+'" style="flex:none" onclick="mcat=\'\';draw()">All</button>'+MCAT.map((c,i)=>`<button class="btn-s${mcat===String(i)?'':' ghost'}" style="flex:none" onclick="mcat='${i}';draw()">${E(c)}</button>`).join('')+'</div>'
  +(L.map(([k,m])=>`<div class="card" onclick="msel='${k}';draw()"><span class="pill">${E(MCAT[m.cat]||'Mission')}</span> <b>${E(m.title)}</b><div class="small">${mMembers(k).length} members · ${mPct(k)}% done</div></div>`).join('')||'<div class="card muted">No missions yet. Start the first one!</div>')
  +`<div class="card"><h3>Start a mission</h3><input id="mT" placeholder="Mission title (e.g. Sell 20 items this month)" maxlength="80"><select id="mC">${MCAT.map((c,i)=>`<option value="${i}">${E(c)}</option>`).join('')}</select><textarea id="mD" placeholder="What is this mission about?" maxlength="300"></textarea><textarea id="mS" placeholder="Steps, one per line (up to 8)"></textarea><button onclick="addMission()">Create mission</button></div>`}

window.onerror=()=>true;applyTheme();
mode('login');
FBP.then(F=>F.onAuthStateChanged(F.auth,u=>{if(signing||me)return;if(u)begin(u);else noAuth()})).catch(()=>noAuth('Cannot reach the server. Check your internet and reload.'));
